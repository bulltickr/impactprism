[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "impactprism"
dynamic = ["version"]
description = "Offline dependency-integrity analysis with CycloneDX SBOM output for npm, Python, and Go"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sbom", "cyclonedx", "supply-chain", "dependency-analysis", "javascript", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Topic :: Software Development",
]
dependencies = [
    "cyclonedx-python-lib[validation]>=11,<12",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
impactprism = "impactprism.cli:main"

[project.urls]
Homepage = "https://github.com/bulltickr/impactprism"
Repository = "https://github.com/bulltickr/impactprism"
Issues = "https://github.com/bulltickr/impactprism/issues"
Documentation = "https://github.com/bulltickr/impactprism#readme"

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "impactprism.__version__"}

[tool.setuptools.package-data]
impactprism = ["cra_clauses.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
