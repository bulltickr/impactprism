name: CRA check

'on':
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  cra-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run analyzer
        id: analyze
        run: |
          set +e
          python main.py analyze "${{ github.workspace }}" --report report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate evidence pack
        if: steps.analyze.outputs.exit_code != '2'
        run: python main.py evidence report.json --markdown evidence.md --json evidence.json

      - name: Post evidence summary comment
        if: steps.analyze.outputs.exit_code != '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('evidence.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail on findings
        if: steps.analyze.outputs.exit_code != '0'
        run: |
          echo "::error::CRA dependency check failed (exit code ${{ steps.analyze.outputs.exit_code }}). Drift and/or undeclared dependencies were found; see the evidence comment on this PR for the CRA-clause evidence."
          exit 1
