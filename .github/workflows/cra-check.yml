name: CRA check

'on':
  pull_request:

permissions:
  contents: read

jobs:
  cra-check:
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.analyze.outputs.exit_code }}
    steps:
      - name: Checkout trusted base ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: scanner

      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: pr

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install trusted scanner
        working-directory: scanner
        run: python -m pip install -e .

      - name: Run analyzer from trusted scanner
        id: analyze
        working-directory: scanner
        run: |
          set +e
          # Keep this policy explicit because `analyze` deliberately does not
          # load configuration from the untrusted pull-request checkout.
          # These are the canonical repository-scan exclusions: the PR
          # contains intentional demo and fixture projects with planted
          # findings that are tested separately by CI.
          python main.py analyze \
            "${{ github.workspace }}/pr" \
            --ecosystem npm \
            --exclude tests \
            --exclude fixtures \
            --exclude demo \
            --exclude node_modules \
            --exclude build \
            --exclude dist \
            --exclude .git \
            --exclude .cache \
            --exclude coverage \
            --exclude public \
            --report report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate evidence pack
        if: steps.analyze.outputs.exit_code != '2'
        working-directory: scanner
        run: python main.py evidence report.json --markdown evidence.md --json evidence.json

      - name: Bound evidence size and content
        if: steps.analyze.outputs.exit_code != '2'
        working-directory: scanner
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("evidence.md")
          raw = p.read_text(encoding="utf-8")
          bounded = "".join(ch for ch in raw if ch in "\r\n\t" or ord(ch) >= 32)[:65536]
          p.write_text(bounded, encoding="utf-8")
          PY

      - name: Upload bounded evidence
        if: steps.analyze.outputs.exit_code != '2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cra-evidence
          path: scanner/evidence.md

      - name: Fail on findings
        if: steps.analyze.outputs.exit_code != '0'
        run: |
          echo "::error::CRA dependency check failed (exit code ${{ steps.analyze.outputs.exit_code }}). Drift and/or undeclared dependencies were found; see the evidence comment on this PR for the CRA-clause evidence."
          exit 1

  post-comment:
    needs: cra-check
    if: ${{ always() && (needs.cra-check.outputs.exit_code == '0' || needs.cra-check.outputs.exit_code == '1') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download bounded evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cra-evidence
          path: evidence

      - name: Post evidence summary comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('evidence/evidence.md', 'utf8');
            body = body.slice(0, 65536);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
