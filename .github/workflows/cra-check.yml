name: CRA check

'on':
  pull_request:

permissions:
  contents: read

jobs:
  cra-check:
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.analyze.outputs.exit_code }}
    steps:
      - name: Checkout trusted base ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: scanner

      - name: Checkout pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: pr

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install trusted scanner
        working-directory: scanner
        run: python -m pip install -e .

      - name: Run analyzer from trusted scanner
        id: analyze
        working-directory: scanner
        run: |
          set +e
          python main.py analyze "${{ github.workspace }}/pr" --report report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate evidence pack
        if: steps.analyze.outputs.exit_code != '2'
        working-directory: scanner
        run: python main.py evidence report.json --markdown evidence.md --json evidence.json

      - name: Bound evidence size and content
        if: steps.analyze.outputs.exit_code != '2'
        working-directory: scanner
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("evidence.md")
          raw = p.read_text(encoding="utf-8")
          bounded = "".join(ch for ch in raw if ch in "\r\n\t" or ord(ch) >= 32)[:65536]
          p.write_text(bounded, encoding="utf-8")
          PY

      - name: Upload bounded evidence
        if: steps.analyze.outputs.exit_code != '2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cra-evidence
          path: scanner/evidence.md

      - name: Fail on findings
        if: steps.analyze.outputs.exit_code != '0'
        run: |
          echo "::error::CRA dependency check failed (exit code ${{ steps.analyze.outputs.exit_code }}). Drift and/or undeclared dependencies were found; see the evidence comment on this PR for the CRA-clause evidence."
          exit 1

  post-comment:
    needs: cra-check
    if: needs.cra-check.outputs.exit_code != '2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download bounded evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cra-evidence
          path: evidence

      - name: Post evidence summary comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('evidence/evidence.md', 'utf8');
            body = body.slice(0, 65536);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
