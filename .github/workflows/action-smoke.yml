name: Action smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clean-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run local Action against clean fixture
        id: impactprism
        uses: ./action
        with:
          repo-path: ${{ github.workspace }}/demo/clean-app
          ecosystem: npm
          fail-on: finding
          artifact-name: ''

      - name: Assert clean outcome
        env:
          OUTCOME: ${{ steps.impactprism.outputs.outcome }}
          EXIT_CODE: ${{ steps.impactprism.outputs.exit-code }}
        run: |
          test "$OUTCOME" = clean
          test "$EXIT_CODE" = 0

  python-clean-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        with:
          persist-credentials: false

      - name: Run local Action against clean Python fixture
        id: impactprism
        uses: ./action
        with:
          repo-path: ${{ github.workspace }}/demo/python-clean
          ecosystem: python
          fail-on: finding
          artifact-name: ''

      - name: Assert clean Python outcome
        env:
          OUTCOME: ${{ steps.impactprism.outputs.outcome }}
          EXIT_CODE: ${{ steps.impactprism.outputs.exit-code }}
        run: |
          test "$OUTCOME" = clean
          test "$EXIT_CODE" = 0

  go-clean-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run local Action against clean Go fixture
        id: impactprism
        uses: ./action
        with:
          repo-path: ${{ github.workspace }}/demo/go-clean
          ecosystem: go
          fail-on: finding
          artifact-name: ''

      - name: Assert clean Go outcome
        env:
          OUTCOME: ${{ steps.impactprism.outputs.outcome }}
          EXIT_CODE: ${{ steps.impactprism.outputs.exit-code }}
        run: |
          test "$OUTCOME" = clean
          test "$EXIT_CODE" = 0

  offline-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python for caller-provided runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install caller-provided dependencies
        run: python -m pip install -e .

      - name: Run Action without bootstrap installation
        uses: ./action
        with:
          repo-path: ${{ github.workspace }}/demo/clean-app
          ecosystem: npm
          fail-on: finding
          install-mode: offline
          python-command: python
          artifact-name: ''
