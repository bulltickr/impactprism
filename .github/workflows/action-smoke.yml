name: Action smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  provider-neutral:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run provider-neutral Action contract
        run: python scripts/ci.py action-smoke

  composite-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run local Action against clean fixture
        id: impactprism
        uses: ./action
        with:
          repo-path: ${{ github.workspace }}/demo/clean-app
          ecosystem: npm
          fail-on: finding
          artifact-name: ''

      - name: Assert clean outcome on every runner
        env:
          OUTCOME: ${{ steps.impactprism.outputs.outcome }}
          EXIT_CODE: ${{ steps.impactprism.outputs.exit-code }}
        shell: pwsh
        run: |
          if ($env:OUTCOME -ne "clean") { throw "unexpected outcome: $env:OUTCOME" }
          if ($env:EXIT_CODE -ne "0") { throw "unexpected exit code: $env:EXIT_CODE" }

  offline-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python for caller-provided runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install caller-provided dependencies
        run: python -m pip install -e .

      - name: Run Action without bootstrap installation
        uses: ./action
        with:
          repo-path: ${{ github.workspace }}/demo/clean-app
          ecosystem: npm
          fail-on: finding
          install-mode: offline
          python-command: python
          artifact-name: ''
