name: Release check

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip build "setuptools>=77"
          python -m pip install -e .[test]

      - name: Verify tag and package metadata
        run: python scripts/check_release.py

      - name: Run tests and local conformance
        run: |
          python scripts/ci.py test
          python scripts/ci.py conformance
          python scripts/ci.py correctness

      - name: Build release artifacts
        run: python -m build --no-isolation
