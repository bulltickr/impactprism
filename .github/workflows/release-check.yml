name: Release check

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .[test]

      - name: Verify tag and package metadata
        run: python scripts/check_release.py

      - name: Run tests and local conformance
        run: |
          python -m pytest -q
          python benchmarks/conformance/run.py --json
          python benchmarks/correctness/run.py --json

      - name: Build release artifacts
        run: python -m build
