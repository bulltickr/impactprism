name: Release check

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip build "setuptools>=77"
          python -m pip install -e .[test]

      - name: Verify tag and package metadata
        run: python scripts/check_release.py

      - name: Run tests and local conformance
        run: |
          python scripts/ci.py test
          python scripts/ci.py conformance
          python scripts/ci.py correctness
          python scripts/ci.py action-smoke

      - name: Build release artifacts
        run: python -m build --no-isolation --sdist --wheel --outdir dist

      - name: Verify exact release artifact set
        run: python scripts/verify_release_artifacts.py dist

      - name: Verify installed wheel smoke
        run: |
          python -m pip install --no-index --no-deps --target .release-wheel dist/*.whl
          PYTHONPATH=.release-wheel python -m impactprism --version
          PYTHONPATH=.release-wheel python -m impactprism scan demo/clean-app

      - name: Generate strict checksums
        run: python scripts/checksums.py --strict dist
