name: Publish GitHub Release artifacts

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing v* tag to validate and publish as a draft-first release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.release-tag }}
  cancel-in-progress: false

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify release metadata
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ inputs.release-tag }}
          PYTHONPATH: src
        run: python scripts/check_release.py

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip build "setuptools>=77"
          python -m pip install -e .[test]

      - name: Run release tests
        run: |
          python scripts/ci.py test
          python scripts/ci.py conformance
          python scripts/ci.py correctness
          python scripts/ci.py action-smoke

      - name: Build release distributions
        run: python -m build --no-isolation --sdist --wheel --outdir dist

      - name: Verify release distributions
        run: python scripts/verify_release_artifacts.py dist

      - name: Smoke test the built wheel
        run: |
          python -m pip install --no-index --no-deps --target .release-wheel dist/*.whl
          PYTHONPATH=.release-wheel python -m impactprism --version
          PYTHONPATH=.release-wheel python -m impactprism scan demo/clean-app

      - name: Generate SHA-256 checksums
        run: python scripts/checksums.py --strict dist

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

      - name: Prepare draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "Release $RELEASE_TAG is already published; immutable releases cannot be modified." >&2
              exit 1
            fi
            echo "Using existing draft release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "ImpactPrism $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Upload artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release upload "$RELEASE_TAG" dist/*

      - name: Publish completed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
