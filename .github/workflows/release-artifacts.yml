name: Publish GitHub Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release metadata
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
          PYTHONPATH: src
        run: python scripts/check_release.py

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .[test]

      - name: Run release tests
        run: |
          python -m pytest -q
          python benchmarks/conformance/run.py --json

      - name: Build release distributions
        run: python -m build --sdist --wheel --outdir dist

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Upload artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
