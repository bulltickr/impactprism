name: Publish GitHub Release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify release metadata
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
          PYTHONPATH: src
        run: python scripts/check_release.py

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip build "setuptools>=77"
          python -m pip install -e .[test]

      - name: Run release tests
        run: |
          python scripts/ci.py test
          python scripts/ci.py conformance
          python scripts/ci.py correctness
          python scripts/ci.py action-smoke

      - name: Build release distributions
        run: python -m build --no-isolation --sdist --wheel --outdir dist

      - name: Verify release distributions
        run: python scripts/verify_release_artifacts.py dist

      - name: Smoke test the built wheel
        run: |
          python -m pip install --no-index --no-deps --target .release-wheel dist/*.whl
          PYTHONPATH=.release-wheel python -m impactprism --version
          PYTHONPATH=.release-wheel python -m impactprism scan demo/clean-app

      - name: Generate SHA-256 checksums
        run: python scripts/checksums.py --strict dist

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

      - name: Upload artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*
