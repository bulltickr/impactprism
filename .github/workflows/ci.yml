name: CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .[test]

      - name: Run tests
        run: python -m pytest -q

      - name: Build package
        run: python -m build

      - name: Self-check with impactprism scan
        run: impactprism scan .

  smoke:
    needs: test
    runs-on: ubuntu-latest
    env:
      SMOKE_DIST: /tmp/impactprism-smoke-dist
      SMOKE_VENV: /tmp/impactprism-smoke-venv
      SMOKE_FIXTURE: ${{ github.workspace }}/demo/clean-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$SMOKE_DIST" "${{ github.workspace }}"

      - name: Install wheel in temporary venv
        run: |
          python -m venv "$SMOKE_VENV"
          "$SMOKE_VENV/bin/python" -m pip install --upgrade pip
          "$SMOKE_VENV/bin/python" -m pip install "$SMOKE_DIST"/impactprism-*.whl

      - name: Smoke-test clean-app fixture
        working-directory: ${{ env.SMOKE_FIXTURE }}
        run: |
          source "$SMOKE_VENV/bin/activate"
          if impactprism scan .; then
            status=0
          else
            status=$?
          fi
          test "$status" -eq 0
