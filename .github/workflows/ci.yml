name: CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .[test]

      - name: Run tests
        run: python -m pytest -q

      - name: Build package
        run: python -m build

      - name: Self-check with impactprism scan
        run: impactprism scan .

  smoke:
    name: Final wheel smoke test
    needs: test
    runs-on: ubuntu-latest
    env:
      SMOKE_WORKSPACE: ${{ github.workspace }}
      SMOKE_DIST: /tmp/impactprism-smoke-dist
      SMOKE_VENV: /tmp/impactprism-smoke-venv
      SMOKE_FIXTURE: ${{ github.workspace }}/demo/clean-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate absolute smoke paths
        run: |
          for smoke_path in "$SMOKE_WORKSPACE" "$SMOKE_DIST" "$SMOKE_VENV" "$SMOKE_FIXTURE"; do
            case "$smoke_path" in
              /*) ;;
              *) echo "Expected an absolute smoke path: $smoke_path" >&2; exit 1 ;;
            esac
          done

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$SMOKE_DIST" "$SMOKE_WORKSPACE"
          set -- "$SMOKE_DIST"/impactprism-*.whl
          test "$#" -eq 1
          test -f "$1"
          printf 'SMOKE_WHEEL=%s\n' "$1" >> "$GITHUB_ENV"

      - name: Install wheel in temporary venv
        run: |
          python -m venv --clear "$SMOKE_VENV"
          test -x "$SMOKE_VENV/bin/python"
          "$SMOKE_VENV/bin/python" -m pip install --upgrade pip
          case "$SMOKE_WHEEL" in
            /*) ;;
            *) echo "Expected an absolute wheel path: $SMOKE_WHEEL" >&2; exit 1 ;;
          esac
          test -f "$SMOKE_WHEEL"
          "$SMOKE_VENV/bin/python" -m pip install --no-cache-dir "$SMOKE_WHEEL"
          "$SMOKE_VENV/bin/python" -m pip check

      - name: Smoke-test clean-app fixture
        working-directory: ${{ env.SMOKE_FIXTURE }}
        run: |
          test -d "$SMOKE_FIXTURE"
          test -x "$SMOKE_VENV/bin/impactprism"
          source "$SMOKE_VENV/bin/activate"
          test "$(command -v impactprism)" = "$SMOKE_VENV/bin/impactprism"
          set +e
          impactprism scan .
          status=$?
          set -e
          test "$status" -eq 0
