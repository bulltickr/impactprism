name: CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .[test]

      - name: Run tests
        run: python -m pytest -q

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run local conformance fixtures
        run: python benchmarks/conformance/run.py --json

      - name: Build package
        run: python -m build

      - name: Self-check with impactprism scan
        run: impactprism scan .

  smoke:
    name: Final wheel smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      SMOKE_WORKSPACE: ${{ github.workspace }}
      SMOKE_DIST: /tmp/impactprism-smoke-dist
      SMOKE_VENV: /tmp/impactprism-smoke-venv
      SMOKE_PYTHON: /tmp/impactprism-smoke-venv/bin/python
      SMOKE_CLI: /tmp/impactprism-smoke-venv/bin/impactprism
      SMOKE_FIXTURE: ${{ github.workspace }}/demo/clean-app
      SMOKE_PYTHON_FIXTURE: ${{ github.workspace }}/demo/python-clean
      SMOKE_GO_FIXTURE: ${{ github.workspace }}/demo/go-clean
      SMOKE_FINDING_FIXTURE: ${{ github.workspace }}/demo/npm-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate absolute smoke paths
        run: |
          for smoke_path in "$SMOKE_WORKSPACE" "$SMOKE_DIST" "$SMOKE_VENV" "$SMOKE_PYTHON" "$SMOKE_CLI" "$SMOKE_FIXTURE" "$SMOKE_PYTHON_FIXTURE" "$SMOKE_GO_FIXTURE" "$SMOKE_FINDING_FIXTURE"; do
            case "$smoke_path" in
              /*) ;;
              *) echo "Expected an absolute smoke path: $smoke_path" >&2; exit 1 ;;
            esac
          done
          test "$SMOKE_FIXTURE" = "$SMOKE_WORKSPACE/demo/clean-app"
          test "$SMOKE_PYTHON_FIXTURE" = "$SMOKE_WORKSPACE/demo/python-clean"
          test "$SMOKE_GO_FIXTURE" = "$SMOKE_WORKSPACE/demo/go-clean"
          test "$SMOKE_FINDING_FIXTURE" = "$SMOKE_WORKSPACE/demo/npm-app"

      - name: Build wheel
        working-directory: ${{ env.SMOKE_WORKSPACE }}
        run: |
          test -d "$SMOKE_WORKSPACE"
          test "$PWD" = "$SMOKE_WORKSPACE"
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$SMOKE_DIST" "$SMOKE_WORKSPACE"
          set -- "$SMOKE_DIST"/impactprism-*.whl
          test "$#" -eq 1
          test -f "$1"
          case "$1" in
            "$SMOKE_DIST"/*) ;;
            *) echo "Expected the wheel under the absolute smoke dist path: $1" >&2; exit 1 ;;
          esac
          printf 'SMOKE_WHEEL=%s\n' "$1" >> "$GITHUB_ENV"

      - name: Install wheel in temporary venv
        run: |
          python -m venv --clear "$SMOKE_VENV"
          test -x "$SMOKE_PYTHON"
          "$SMOKE_PYTHON" -m pip install --upgrade pip
          case "$SMOKE_WHEEL" in
            /*) ;;
            *) echo "Expected an absolute wheel path: $SMOKE_WHEEL" >&2; exit 1 ;;
          esac
          test -f "$SMOKE_WHEEL"
          "$SMOKE_PYTHON" -m pip install --no-cache-dir "$SMOKE_WHEEL"
          "$SMOKE_PYTHON" -m pip check
          test -x "$SMOKE_CLI"
          installed_package="$("$SMOKE_PYTHON" -c 'import impactprism; print(impactprism.__file__)')"
          case "$installed_package" in
            "$SMOKE_VENV"/lib/python*/site-packages/impactprism/*) ;;
            *) echo "Expected impactprism to import from the temporary venv: $installed_package" >&2; exit 1 ;;
          esac

      - name: Smoke-test clean-app fixture
        working-directory: ${{ env.SMOKE_FIXTURE }}
        run: |
          test -d "$SMOKE_FIXTURE"
          test "$PWD" = "$SMOKE_FIXTURE"
          test -f "$SMOKE_FIXTURE/package.json"
          test -f "$SMOKE_FIXTURE/package-lock.json"
          test -x "$SMOKE_CLI"
          source "$SMOKE_VENV/bin/activate"
          test "$(command -v impactprism)" = "$SMOKE_CLI"
          set +e
          "$SMOKE_CLI" scan .
          status=$?
          set -e
          printf 'impactprism scan exit code: %s\n' "$status"
          test "$status" -eq 0

      - name: Smoke-test clean Python fixture
        working-directory: ${{ env.SMOKE_PYTHON_FIXTURE }}
        run: |
          test "$PWD" = "$SMOKE_PYTHON_FIXTURE"
          test -f "$SMOKE_PYTHON_FIXTURE/pyproject.toml"
          test -f "$SMOKE_PYTHON_FIXTURE/requirements.txt"
          source "$SMOKE_VENV/bin/activate"
          impactprism scan .

      - name: Smoke-test clean Go fixture
        working-directory: ${{ env.SMOKE_GO_FIXTURE }}
        run: |
          test "$PWD" = "$SMOKE_GO_FIXTURE"
          test -f "$SMOKE_GO_FIXTURE/go.mod"
          source "$SMOKE_VENV/bin/activate"
          impactprism scan .

      - name: Smoke-test finding exit behavior
        working-directory: ${{ env.SMOKE_FINDING_FIXTURE }}
        run: |
          test "$PWD" = "$SMOKE_FINDING_FIXTURE"
          source "$SMOKE_VENV/bin/activate"
          set +e
          impactprism scan .
          status=$?
          set -e
          printf 'finding fixture exit code: %s\n' "$status"
          test "$status" -eq 1
