name: CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .[test]

      - name: Run tests
        run: python -m pytest -q

      - name: Build package
        run: python -m build

      - name: Self-check with impactprism scan
        run: impactprism scan .

  smoke:
    name: Final wheel smoke test
    needs: test
    runs-on: ubuntu-latest
    env:
      SMOKE_WORKSPACE: ${{ github.workspace }}
      SMOKE_DIST: /tmp/impactprism-smoke-dist
      SMOKE_VENV: /tmp/impactprism-smoke-venv
      SMOKE_FIXTURE: ${{ github.workspace }}/demo/clean-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate absolute smoke paths
        run: |
          for smoke_path in "$SMOKE_WORKSPACE" "$SMOKE_DIST" "$SMOKE_VENV" "$SMOKE_FIXTURE"; do
            case "$smoke_path" in
              /*) ;;
              *) echo "Expected an absolute smoke path: $smoke_path" >&2; exit 1 ;;
            esac
          done

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$SMOKE_DIST" "$SMOKE_WORKSPACE"

      - name: Install wheel in temporary venv
        run: |
          python -m venv "$SMOKE_VENV"
          "$SMOKE_VENV/bin/python" -m pip install --upgrade pip
          smoke_wheel="$(find "$SMOKE_DIST" -maxdepth 1 -type f -name 'impactprism-*.whl' -print -quit)"
          test -n "$smoke_wheel"
          case "$smoke_wheel" in
            /*) ;;
            *) echo "Expected an absolute wheel path: $smoke_wheel" >&2; exit 1 ;;
          esac
          "$SMOKE_VENV/bin/python" -m pip install "$smoke_wheel"

      - name: Smoke-test clean-app fixture
        working-directory: ${{ env.SMOKE_FIXTURE }}
        run: |
          test -d "$SMOKE_FIXTURE"
          test -x "$SMOKE_VENV/bin/impactprism"
          if "$SMOKE_VENV/bin/impactprism" scan .; then
            status=0
          else
            status=$?
          fi
          test "$status" -eq 0
