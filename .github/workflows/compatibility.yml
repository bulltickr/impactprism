name: Public compatibility corpus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Pinned real-repository compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ImpactPrism
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ImpactPrism
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Prepare pinned public repositories
        run: |
          python benchmarks/compatibility/prepare.py \
            benchmarks/compatibility/manifest.json \
            "$RUNNER_TEMP/impactprism-compatibility"

      - name: Run offline compatibility corpus
        run: |
          python benchmarks/compatibility/run.py \
            benchmarks/compatibility/manifest.json \
            "$RUNNER_TEMP/impactprism-compatibility" \
            --json
