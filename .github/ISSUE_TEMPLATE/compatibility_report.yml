name: Compatibility report
description: Report a real repository shape that needs review or support
title: "compatibility: "
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, proprietary source, and private lockfile contents.
        A small sanitized fixture is preferred over a complete repository.
        See the [sanitized reproduction intake contract](https://github.com/bulltickr/impactprism/blob/main/docs/REPRODUCTION_INTAKE.md)
        before attaching a bundle.
  - type: input
    id: version
    attributes:
      label: ImpactPrism version or commit
    validations:
      required: true
  - type: dropdown
    id: ecosystem
    attributes:
      label: Ecosystem
      options:
        - npm
        - Python
        - Go
        - Multiple ecosystems
    validations:
      required: true
  - type: input
    id: package_manager
    attributes:
      label: Package manager or workspace format
      placeholder: pnpm workspace, Poetry, uv, Go workspaces
    validations:
      required: true
  - type: dropdown
    id: provenance
    attributes:
      label: Reproduction provenance
      description: Be explicit about whether the bundle is invented or reduced from a real repository.
      options:
        - synthetic
        - sanitized-external
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Review-only scan command
      placeholder: impactprism scan . --ecosystem npm --json
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Include the smallest manifest, lockfile, source, and configuration shape that reproduces the behavior.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
      description: Include finding type, package/module, provenance, and relevant output.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Analysis boundary
      options:
        - label: The reproduction may involve generated source, dynamic loading, or runtime-only resolution.
        - label: I have removed secrets and proprietary source.
          required: true
        - label: I understand this report is compatibility evidence for review, not an accuracy score or compliance claim.
          required: true
