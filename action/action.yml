# Required workflow permissions (must be set by the calling workflow): contents: read, security-events: write.
# Composite actions cannot declare permissions themselves.

name: ImpactPrism
description: |
  Runs the ImpactPrism dependency-drift scan and produces a review-oriented
  evidence pack with contextual CRA references, a CycloneDX SBOM, and a SARIF
  report.

  The calling workflow must grant these permissions:
  contents: read, security-events: write.

  The step fails only per the fail-on policy (never|finding|all). It requires
  no hosted ImpactPrism account and no API key, scans the checked-out commit
  offline, and never uploads source code - only the generated
  reports under the output directory are uploaded.

inputs:
  repo-path:
    description: Path to the repository to scan.
    required: false
    default: ${{ github.workspace }}
  ecosystem:
    description: "Ecosystem to scan. Valid values: auto|npm|python|go."
    required: false
    default: auto
  fail-on:
    description: "Exit policy. Valid values: never|finding|all."
    required: false
    default: finding
  severity-threshold:
    description: "Minimum finding severity that trips the policy. Valid values: info|low|medium|high|critical."
    required: false
    default: low
  output-dir:
    description: Directory for generated reports, relative to the workspace.
    required: false
    default: impactprism-reports
  artifact-name:
    description: Upload artifact name; an empty string disables the upload.
    required: false
    default: impactprism-reports
  install-mode:
    description: "Bootstrap mode: managed installs dependencies; offline uses caller-provided Python dependencies."
    required: false
    default: managed
  python-command:
    description: Python executable used by offline mode.
    required: false
    default: python
  exclude:
    description: Newline-separated directory names or repository-relative directory prefixes to exclude in addition to repository defaults.
    required: false
    default: ""
  config-path:
    description: Optional ImpactPrism TOML configuration path; otherwise .impactprism.toml is auto-detected.
    required: false
    default: ""
  baseline-path:
    description: Optional previous canonical scan report, resolved relative to the scanned repository.
    required: false
    default: ""
  delta-path:
    description: Optional path for the baseline delta JSON, resolved relative to the scanned repository.
    required: false
    default: ""

outputs:
  outcome:
    description: Classification outcome (clean|finding|policy-failure|unsupported-ecosystem|scanner-error).
    value: ${{ steps.run.outputs.outcome }}
  findings-path:
    description: Absolute path to findings.json.
    value: ${{ steps.run.outputs.findings-path }}
  bom-path:
    description: Absolute path to bom.json (empty when not produced).
    value: ${{ steps.run.outputs.bom-path }}
  sarif-path:
    description: Absolute path to impactprism.sarif.
    value: ${{ steps.run.outputs.sarif-path }}
  evidence-path:
    description: Absolute path to evidence.json.
    value: ${{ steps.run.outputs.evidence-path }}
  exit-code:
    description: Exit code produced by the scan step.
    value: ${{ steps.run.outputs.exit-code }}
  output-dir:
    description: Absolute path to the directory containing the generated reports.
    value: ${{ steps.run.outputs.output-dir }}

runs:
  using: composite
  steps:
    - name: Validate installation mode
      shell: bash
      env:
        INSTALL_MODE: ${{ inputs.install-mode }}
      run: |
        case "$INSTALL_MODE" in
          managed|offline) ;;
          *) echo "install-mode must be managed or offline" >&2; exit 2 ;;
        esac

    - name: Set up Python
      if: ${{ inputs.install-mode == 'managed' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      if: ${{ inputs.install-mode == 'managed' }}
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ github.action_path }}/.."

    - name: Verify offline Python runtime
      if: ${{ inputs.install-mode == 'offline' }}
      shell: bash
      env:
        PYTHON_COMMAND: ${{ inputs.python-command }}
        PYTHONPATH: ${{ github.action_path }}/../src
      run: |
        set -euo pipefail
        command -v "$PYTHON_COMMAND"
        PIP_NO_INDEX=1 "$PYTHON_COMMAND" -c 'import impactprism; import cyclonedx; import yaml'

    - name: Run ImpactPrism scan
      id: run
      shell: bash
      env:
        INPUT_REPO_PATH: ${{ inputs.repo-path }}
        INPUT_ECOSYSTEM: ${{ inputs.ecosystem }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_INSTALL_MODE: ${{ inputs.install-mode }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_BASELINE_PATH: ${{ inputs.baseline-path }}
        INPUT_DELTA_PATH: ${{ inputs.delta-path }}
        PYTHON_COMMAND: ${{ inputs.python-command }}
        PIP_NO_INDEX: "1"
        PYTHONPATH: ${{ github.action_path }}/../src
      run: |
        "$PYTHON_COMMAND" "${{ github.action_path }}/run.py"

    - name: Upload reports
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.output-dir }}
        if-no-files-found: ignore
        retention-days: 14
